# Unified pytest config for the hermes-switchyard selfhosted battery.
# Layers and what they verify are defined in TEST-PLAN.md §3; the
# file-to-layer mapping lives in tests/conftest.py.
#
#   make test          run the whole battery (all layers + portability)
#   make test-unit     fast unit-only mode
#
# Every layer is offline and deterministic; only scripts/ci/live_jev_contract.py
# (manual, CI-gated) touches the real operator server.
[pytest]
testpaths = .
addopts = -ra --strict-markers --import-mode=importlib
markers =
    unit: offline unit tests (synthetic transports; no Hermes host seams required)
    integration: real Hermes loader driven from a disposable HERMES_HOME (offline)
    e2e: black-box end-to-end scenarios over real loopback sockets (offline)
